# Pré-visualização no Netlify: publica a pasta site/ como está (não há etapa de build).
[build]
  publish = "site"
  command = ""

# O painel do blog e o blog dinâmico rodam em PHP, que só existe na KingHost.
# No Netlify esses arquivos não podem nem ser baixados: respondem como página inexistente.
[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_blog/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/blog.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/blog/pagina"
  to = "/blog/"
  status = 301

# O endereço do Netlify é só para pré-visualização: não deve aparecer no Google
# (o site oficial é www.contelb.com.br; cada página já aponta para ele no canonical).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
